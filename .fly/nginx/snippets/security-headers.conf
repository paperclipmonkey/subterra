# Shared response headers. nginx only inherits add_header into a location that
# sets none of its own, so every location with add_header must include this.
#
# X-Frame-Options is deliberately NOT here: PHP responses get it from the
# SetFrameHeaders middleware, which exempts /embed/* (iframed by club websites).
# A server-wide nginx header overrode that exemption and blocked every embed.
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer-when-downgrade" always;
add_header Strict-Transport-Security "max-age=31536000" always;
