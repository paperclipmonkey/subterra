# Pip (/api/assistant/*) runs in its own php-fpm pool: it streams long SSE
# replies that the main pool's 60s request_terminate_timeout would kill. See
# .fly/fpm/pool.d/assistant.conf. Matched on the original URI because the PHP
# location only sees the rewritten /index.php.
map $request_uri $php_fpm_socket {
    default           unix:/var/run/php/php-fpm.sock;
    ~^/api/assistant/ unix:/var/run/php/php-fpm-assistant.sock;
}
