# If Fly-Client-Ip is empty, set $forwarded_header_value to
# value of X-Forwarded-For, else set
# $forwarded_header_value to value of Fly-Client-Ip
map $http_fly_client_ip $forwarded_header_value {
    default $http_fly_client_ip;
    "" $http_x_forwarded_for;
}

# Keep bearer secrets out of the access log (it goes to stdout and on to
# Fly's log shipping). Some URLs are credentials in themselves:
#   /magiclink/<token>                   magic-link login
#   ?token=... / ?code=...               magic-link callbacks, Google OAuth code
#   /api/webhooks/twilio/<secret>/...    Twilio webhook shared secret
# Map regexes are tried in order and only the first match is applied; no real
# request carries more than one of these.
map $request $redacted_request {
    default $request;
    "~^(?<rr_a>\S+ /magiclink/)[^\s?]+(?<rr_b>.*)$"                 "${rr_a}[REDACTED]${rr_b}";
    "~^(?<rr_a>\S+ /api/webhooks/twilio/)[^\s/?]+(?<rr_b>.*)$"      "${rr_a}[REDACTED]${rr_b}";
    "~^(?<rr_a>\S+ [^?\s]*\?(?:\S*&)?(?:token|code)=)[^&\s]*(?<rr_b>.*)$" "${rr_a}[REDACTED]${rr_b}";
}

# The SPA's /auth/magic-link-callback?token=... page sends its URL as the
# Referer on every asset and API request it makes.
map $http_referer $redacted_referer {
    default $http_referer;
    "~^(?<rf_a>[^?]*/magiclink/)[^?]+(?<rf_b>.*)$"                 "${rf_a}[REDACTED]${rf_b}";
    "~^(?<rf_a>[^?]*\?(?:.*&)?(?:token|code)=)[^&]*(?<rf_b>.*)$"   "${rf_a}[REDACTED]${rf_b}";
}

# Use variable $forwarded_header_value in place where we'd normally
# see $http_x_forwarded_For. We prefer the value of Fly-Client-Ip
# if it's available
log_format  fly  '$remote_addr - $remote_user [$time_local] "$redacted_request" '
                 '$status $body_bytes_sent "$redacted_referer" '
                 '"$http_user_agent" "$forwarded_header_value"';
