[program:scheduler]
command=/bin/sh -c "echo '* * * * * www-data php /var/www/html/artisan schedule:run >> /dev/stdout 2>&1' > /etc/cron.d/laravel && chmod 0644 /etc/cron.d/laravel && cron -f"
user=root
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
