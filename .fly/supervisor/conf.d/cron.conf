[program:scheduler]
# NOTE: do NOT redirect to /dev/stdout here. Supervisor captures the child's stdout/stderr
# via stdout_logfile/stderr_logfile below (it runs as root and can write /dev/stdout). A shell
# `>> /dev/stdout` redirect is opened by the *child* — which runs as www-data and cannot open
# /dev/stdout, so the redirect fails and schedule:run never runs at all (silent cron outage).
# schedule:work (not a `schedule:run; sleep 60` loop) so each tick lands on the minute
# boundary. The sleep loop drifted by however long the jobs took, so it periodically
# skipped a whole minute — silently missing time-pinned jobs like the daily purge.
command=php /var/www/html/artisan schedule:work --no-interaction
autostart=true
autorestart=true
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
