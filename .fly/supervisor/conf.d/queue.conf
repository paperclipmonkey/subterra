[program:laravel-queue]
# --backoff spaces retries out (10s, 1m, 5m). Without it all three attempts ran
# within seconds, so a brief mail/API outage exhausted them. Jobs that define
# their own backoff() (e.g. CancelWatchdogJob) keep it.
priority=10
autostart=true
autorestart=true
user=www-data
stdout_events_enabled=true
stderr_events_enabled=true
command=nice -n 19 php /var/www/html/artisan queue:work --sleep=3 --tries=3 --backoff=10,60,300 --memory=256 --timeout=300 --rest=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
