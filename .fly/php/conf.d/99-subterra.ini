; Loaded by the CLI SAPI, which is what the Octane (RoadRunner) workers run
; under. php-fpm pools set these with php_admin_value, but the CLI otherwise
; gets the stock php.ini limits (post_max_size = 8M), and Laravel's
; ValidatePostSize middleware then rejects any larger request, such as a trip
; with a couple of phone photos, with a 413. Values come from the Dockerfile ENV.
post_max_size = ${PHP_POST_MAX_SIZE}
upload_max_filesize = ${PHP_UPLOAD_MAX_FILE_SIZE}
