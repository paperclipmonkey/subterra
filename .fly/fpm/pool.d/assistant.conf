; @fly settings: php-fpm now serves only /api/assistant/*; everything else
; runs on Octane (see nginx sites-available/default).
;
; Pip streams Server-Sent Events across several model calls and tool
; dispatches, so a legitimate reply can run well past 60s of wall time while
; still sending data. Octane kills requests at 60s
; (octane.max_execution_time), which would cut those streams off mid-answer with
; no done/error event. Keeping Pip here gives it a longer limit and also stops a
; burst of slow Pip requests from occupying the Octane workers.

[global]
error_log = /proc/self/fd/2
daemonize = no

[assistant]
user = www-data
group = www-data

listen = /var/run/php/php-fpm-assistant.sock
listen.owner = www-data
listen.group = www-data

; Spawned on demand: Pip is rate limited per user and idle most of the time.
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 30s
pm.max_requests = 100

access.log = /proc/self/fd/1

; Backstop only. Five tool iterations with 60s model timeouts plus the final
; answer stay under this; a hung worker is still reclaimed.
request_terminate_timeout = 360s

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[open_basedir] = /var/www/html:/dev/stdout:/tmp
php_admin_flag[session.cookie_secure] = true
php_value[date.timezone] = ${PHP_DATE_TIMEZONE}
php_admin_value[display_errors] = ${PHP_DISPLAY_ERRORS}
php_admin_value[error_reporting] = ${PHP_ERROR_REPORTING}
php_admin_value[memory_limit] = ${PHP_MEMORY_LIMIT}
php_admin_value[max_execution_time] = ${PHP_MAX_EXECUTION_TIME}
php_admin_value[post_max_size] = ${PHP_POST_MAX_SIZE}
php_admin_value[upload_max_filesize] = ${PHP_UPLOAD_MAX_FILE_SIZE}
php_admin_value[allow_url_fopen] = ${PHP_ALLOW_URL_FOPEN}
