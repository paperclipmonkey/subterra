# fly.toml app configuration file generated for subterra on 2024-10-10T00:49:26+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'subterra'
primary_region = 'lhr'
console_command = 'php /var/www/html/artisan tinker'

# Swap is only a safety margin. On a shared CPU, swapping stalls every worker
# (including /up), so size children to fit in RAM rather than leaning on it.
swap_size_mb = 512

[deploy]
  release_command = "php /var/www/html/artisan migrate --force"
  strategy = "bluegreen"

[build]
  [build.args]
    NODE_VERSION = '24'
    PHP_VERSION = '8.4'

[env]
  APP_ENV = 'production'
  APP_URL = 'https://subterra.world'
  LOG_CHANNEL = 'stack'
  LOG_STACK = 'stderr,slack'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  GOOGLE_REDIRECT_URL="https://subterra.world/api/google/callback"
  QUEUE_CONNECTION="database"
  TWILIO_ENABLED='false'
  # Octane workers each hold a booted app (~80-100MB), alongside nginx, the Pip
  # php-fpm pool, the queue worker and the scheduler.
  OCTANE_WORKERS='8'
  APP_NAME='Subterra.world'


[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']
[[http_service.checks]]
  grace_period = "10s"
  interval = "10s"
  method = "GET"
  timeout = "5s"
  # /up is served by Octane (without touching the DB). "/" is the static
  # SPA index.html served straight by nginx, so it stayed green while PHP was down.
  path = "/up"

[[vm]]
  size = 'shared-cpu-1x'
  memory = "2048mb"
