    <rect x="-44" y="-62" width="88" height="118" rx="6" fill="#f4efdd"/>
    <rect x="-26" y="-92" width="52" height="26" rx="8" fill="#b98a18"/>
    <line x1="-28" y1="-30" x2="28" y2="-30" stroke="#3b3a2e" stroke-width="9" stroke-linecap="round"/>
    <line x1="-28" y1="-4" x2="28" y2="-4" stroke="#3b3a2e" stroke-width="9" stroke-linecap="round"/>
    <line x1="-28" y1="22" x2="6" y2="22" stroke="#3b3a2e" stroke-width="9" stroke-linecap="round"/>
