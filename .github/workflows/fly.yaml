name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, sqlite3
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
      - name: Copy .env if needed
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
      - name: Generate app key
        run: php artisan key:generate
      - name: Set up SQLite database
        run: |
          touch database.sqlite
      - name: Run migrations
        run: php artisan migrate --force
      - name: Run tests
        run: vendor/bin/phpunit

  frontend-tests:
    runs-on: ubuntu-latest
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: cd frontend && yarn install --frozen-lockfile
      - name: Run frontend tests
        run: cd frontend && yarn test:run
      - name: Build frontend
        run: cd frontend && yarn run build

  deploy-watchdog:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    concurrency: deploy-watchdog-group
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io
      
      - name: Build and push Docker image
        run: |
          cd gcp-watchdog
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/subterra-watchdog:${{ github.sha }} \
                       -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/subterra-watchdog:latest .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/subterra-watchdog:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/subterra-watchdog:latest
      
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Terraform Init
        run: |
          cd gcp-watchdog/terraform
          terraform init
      
      - name: Terraform Apply
        run: |
          cd gcp-watchdog/terraform
          terraform apply -auto-approve \
            -var="project_id=${{ secrets.GCP_PROJECT_ID }}" \
            -var="region=${{ secrets.GCP_REGION }}" \
            -var="image_tag=${{ github.sha }}" \
            -var="textmagic_username=${{ secrets.TEXTMAGIC_USERNAME }}" \
            -var="textmagic_api_key=${{ secrets.TEXTMAGIC_API_KEY }}" \
            -var="smtp_server=${{ secrets.SMTP_SERVER }}" \
            -var="smtp_port=${{ secrets.SMTP_PORT }}" \
            -var="smtp_username=${{ secrets.SMTP_USERNAME }}" \
            -var="smtp_password=${{ secrets.SMTP_PASSWORD }}" \
            -var="smtp_from_email=${{ secrets.SMTP_FROM_EMAIL }}"

  deploy:
    needs: [backend-tests, frontend-tests, deploy-watchdog]
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Make HTTP request # Ensure the api is up. Helps with postgres going to sleep
        run: |
          curl -s https://subterra.world/api/livez > /dev/null; sleep 15
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}