name: Deploy
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/_test.yaml

  deploy-gcp:
    needs: [tests]
    runs-on: ubuntu-latest
    concurrency: deploy-gcp-group
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
      GCP_REGION: europe-west2
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev

      - name: Build and push Watchdog image
        run: |
          cd gcp-watchdog
          docker build -t europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/subterra-watchdog/subterra-watchdog:${{ github.sha }} .
          docker push europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/subterra-watchdog/subterra-watchdog:${{ github.sha }}

      - name: Build and push Image Processor image
        run: |
          cd gcp-image-processor
          docker build -t europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/subterra-image-processor/subterra-image-processor:${{ github.sha }} .
          docker push europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/subterra-image-processor/subterra-image-processor:${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('terraform/gcp/.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - name: Terraform Init
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          cd terraform/gcp
          terraform init

      - name: Terraform Apply
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_image_processor_image_tag: ${{ github.sha }}
          TF_VAR_smtp_server: ${{ secrets.SMTP_SERVER }}
          TF_VAR_smtp_from_email: ${{ secrets.SMTP_FROM_EMAIL }}
          TF_VAR_webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          TF_VAR_watchdog_api_key: ${{ secrets.WATCHDOG_API_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_authorized_networks: ${{ secrets.DB_AUTHORIZED_NETWORKS }}
        run: |
          cd terraform/gcp
          terraform apply -auto-approve

  # Builds and pushes the Fly image while the tests run, instead of after them.
  # Nothing is released here: deploy-fly still waits for the tests and only
  # then rolls this image out. Layers are cached in the GitHub Actions cache,
  # so the PHP/apt base layer is rebuilt only when it actually changes.
  build-fly:
    runs-on: ubuntu-latest
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Log in to the Fly registry
        run: flyctl auth docker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: registry.fly.io/subterra:${{ github.sha }}
          # Mirrors [build.args] in fly.toml, which only applies when flyctl
          # builds the image itself.
          build-args: |
            NODE_VERSION=24
            PHP_VERSION=8.4
          cache-from: type=gha,scope=fly
          cache-to: type=gha,mode=max,scope=fly

  deploy-fly:
    needs: [tests, build-fly]
    runs-on: ubuntu-latest
    concurrency: deploy-fly-group
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      # Wake Postgres before the release command migrates. /api/livez runs
      # SELECT 1 and only returns 200 once the database answers, so stop as soon
      # as it does instead of sleeping a fixed 15s. Never fails the deploy.
      - name: Wake the database
        run: |
          for attempt in $(seq 1 20); do
            curl -sf --max-time 10 https://subterra.world/api/livez > /dev/null && exit 0
            sleep 3
          done
          echo "::warning::/api/livez did not return 200; deploying anyway"
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --image registry.fly.io/subterra:${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
