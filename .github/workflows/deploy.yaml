name: Deploy
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, bcmath, sqlite3
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest
      - name: Copy .env if needed
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi
      - name: Generate app key
        run: php artisan key:generate
      - name: Set up SQLite database
        run: |
          touch database.sqlite
      - name: Run migrations
        run: php artisan migrate --force
      - name: Run tests
        run: vendor/bin/phpunit

  frontend-tests:
    runs-on: ubuntu-latest
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: cd frontend && yarn install --frozen-lockfile
      - name: Run frontend tests
        run: cd frontend && yarn test:run
      - name: Build frontend
        run: cd frontend && yarn run build

  watchdog-tests:
    runs-on: ubuntu-latest
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: gcp-watchdog/yarn.lock
      - name: Install watchdog dependencies
        run: cd gcp-watchdog && yarn install --frozen-lockfile
      - name: Run watchdog tests
        run: cd gcp-watchdog && yarn test

  image-processor-tests:
    runs-on: ubuntu-latest
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "yarn"
          cache-dependency-path: gcp-image-processor/yarn.lock
      - name: Install image processor dependencies
        run: cd gcp-image-processor && yarn install --frozen-lockfile
      - name: Run image processor tests
        run: cd gcp-image-processor && yarn test

  deploy-gcp:
    needs:
      [backend-tests, frontend-tests, watchdog-tests, image-processor-tests]
    runs-on: ubuntu-latest
    concurrency: deploy-gcp-group
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
      GCP_REGION: europe-west2
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev

      - name: Build and push Watchdog image
        run: |
          cd gcp-watchdog
          docker build -t europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/subterra-watchdog/subterra-watchdog:${{ github.sha }} .
          docker push europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/subterra-watchdog/subterra-watchdog:${{ github.sha }} || echo "Image already exists, skipping push"

      - name: Build and push Image Processor image
        run: |
          cd gcp-image-processor
          docker build -t europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/subterra-image-processor/subterra-image-processor:${{ github.sha }} .
          docker push europe-west2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/subterra-image-processor/subterra-image-processor:${{ github.sha }} || echo "Image already exists, skipping push"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Terraform Init
        run: |
          cd terraform/gcp
          terraform init

      - name: Terraform Apply
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_image_processor_image_tag: ${{ github.sha }}
          TF_VAR_smtp_server: ${{ secrets.SMTP_SERVER }}
          TF_VAR_smtp_from_email: ${{ secrets.SMTP_FROM_EMAIL }}
          TF_VAR_webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          TF_VAR_watchdog_api_key: ${{ secrets.WATCHDOG_API_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_db_authorized_networks: ${{ secrets.DB_AUTHORIZED_NETWORKS }}
        run: |
          cd terraform/gcp
          terraform apply -auto-approve

  deploy-fly:
    needs:
      [backend-tests, frontend-tests, watchdog-tests, image-processor-tests]
    runs-on: ubuntu-latest
    concurrency: deploy-fly-group
    env:
      COPILOT_AGENT_FIREWALL_ENABLED: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Make HTTP request # Ensure the api is up. Helps with postgres going to sleep
        run: |
          curl -s https://subterra.world/api/livez > /dev/null; sleep 15
      - name: Set up Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
